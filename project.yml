name: ChoreQuest

options:
  bundleIdPrefix: com.jaoliveira98
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Personal-team id, committed so it survives `xcodegen generate` / git pull and
    # both targets stay signed. It's not a secret (it ships inside every app) and
    # this repo is private. Replace it if you build under a different Apple ID.
    DEVELOPMENT_TEAM: "D5TCJMS37M"

targets:
  ChoreQuest:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChoreQuest
      - path: Shared
    dependencies:
      - target: ChoreQuestWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaoliveira98.chorequest
        PRODUCT_NAME: ChoreQuest
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: ChoreQuest
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # App uses only standard HTTPS (Supabase) → exempt from export compliance.
        # Declaring this skips the encryption question on every TestFlight upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      configs:
        Debug:
          ENABLE_TESTABILITY: YES # allow @testable import from the test target

  ChoreQuestTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: ChoreQuest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaoliveira98.chorequest.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ChoreQuest.app/ChoreQuest"
        BUNDLE_LOADER: "$(TEST_HOST)"

  ChoreQuestWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ChoreQuestWatch
      - path: Shared
      # Share two pure-SwiftUI helpers without moving them out of the iOS tree.
      - path: ChoreQuest/Helpers/Color+Hex.swift
      - path: ChoreQuest/Views/Components/AvatarView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaoliveira98.chorequest.watchkitapp
        # Must differ from the iOS app's product name (also "ChoreQuest"); otherwise
        # the watch app embeds as ChoreQuest.app inside ChoreQuest.app — a name
        # collision that can break the on-watch install ("could not be installed at
        # this time"). The user-visible name stays "ChoreQuest" via CFBundleDisplayName.
        PRODUCT_NAME: ChoreQuestWatch
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        TARGETED_DEVICE_FAMILY: "4" # Apple Watch
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: ChoreQuest
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.jaoliveira98.chorequest
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

schemes:
  ChoreQuest:
    build:
      targets:
        ChoreQuest: all
        ChoreQuestWatch: all
        ChoreQuestTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChoreQuestTests
    archive:
      config: Release

  ChoreQuestWatch:
    build:
      targets:
        ChoreQuestWatch: all
    run:
      config: Debug
    archive:
      config: Release
